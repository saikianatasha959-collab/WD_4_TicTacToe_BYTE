<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<meta name="description" content="A clean, responsive two-player Tic Tac Toe game playable in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card" role="main">
    <header class="card__header">
      <h1 class="wordmark">Tic Tac Toe</h1>
      <p class="tagline">Two players, one board, take turns.</p>
    </header>

    <p class="status" id="status" aria-live="polite">Player X's turn</p>

    <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
      <button class="cell" data-index="0" role="gridcell" aria-label="Row 1, column 1, empty"></button>
      <button class="cell" data-index="1" role="gridcell" aria-label="Row 1, column 2, empty"></button>
      <button class="cell" data-index="2" role="gridcell" aria-label="Row 1, column 3, empty"></button>
      <button class="cell" data-index="3" role="gridcell" aria-label="Row 2, column 1, empty"></button>
      <button class="cell" data-index="4" role="gridcell" aria-label="Row 2, column 2, empty"></button>
      <button class="cell" data-index="5" role="gridcell" aria-label="Row 2, column 3, empty"></button>
      <button class="cell" data-index="6" role="gridcell" aria-label="Row 3, column 1, empty"></button>
      <button class="cell" data-index="7" role="gridcell" aria-label="Row 3, column 2, empty"></button>
      <button class="cell" data-index="8" role="gridcell" aria-label="Row 3, column 3, empty"></button>
    </div>

    <div class="scoreboard">
      <div class="score">
        <p class="score__label">Player X</p>
        <p class="score__value" id="score-x">0</p>
      </div>
      <div class="score">
        <p class="score__label">Draws</p>
        <p class="score__value" id="score-draw">0</p>
      </div>
      <div class="score">
        <p class="score__label">Player O</p>
        <p class="score__value" id="score-o">0</p>
      </div>
    </div>

    <button class="reset-btn" id="reset-btn" type="button">New round</button>
  </main>

<script src="script.js"></script>
</body>
</html>
